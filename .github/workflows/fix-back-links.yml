name: Fix Report Back Links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix generated report back links
        run: |
          python scripts/fix_back_links.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canada/morning taiwan/morning taiwan/closing scripts/fix_back_links.py
          if git diff --staged --quiet; then
            echo "No backlink changes"
          else
            git commit -m "Fix report back links to homepage"
            git push
          fi

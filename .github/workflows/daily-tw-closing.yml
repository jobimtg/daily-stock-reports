name: Daily TW Closing Report (台灣收盤報)

on:
  schedule:
    - cron: "5 6 * * 1-5"
  repository_dispatch:
    types: [trigger-tw-closing]
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE notification"
        required: false
        type: boolean
        default: false
      force_line:
        description: "Force LINE even if already sent today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-tw-closing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p taiwan/closing cache

      - name: Restore cache (rotation + LINE push log)
        uses: actions/cache@v4
        with:
          path: cache
          key: report-cache-tw-closing-${{ github.run_number }}
          restore-keys: |
            report-cache-tw-closing-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clear today's Gemini cache
        run: |
          TZ="Asia/Taipei" python3 - <<'PYEOF'
          import datetime, pathlib, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Taipei")).date().isoformat()
          for f in pathlib.Path("cache").glob(f"gemini_tw_closing_{today}.json"):
              f.unlink()
              print(f"Deleted: {f}")
          PYEOF

      - name: Generate Taiwan closing report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region tw_closing

      - name: Commit and push report
        run: |
          git add .nojekyll taiwan/closing/

          if git diff --staged --quiet; then
            echo "No new report to commit"
          else
            git commit -m "📊 Taiwan closing report $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: sleep 45

      - name: Send LINE notification (群組)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_FORCE_PUSH: ${{ github.event.inputs.force_line }}
        run: |
          python scripts/notify_line.py --audience tw_group_closing

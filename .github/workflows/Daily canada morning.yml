name: Daily Canada Morning Report (加拿大晨報)

on:
  schedule:
    - cron: "55 15 * * 1-5"
  repository_dispatch:
    types: [trigger-canada-morning]
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE notification"
        required: false
        type: boolean
        default: false
      force_line:
        description: "Force LINE even if already sent today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-canada-morning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p canada/morning cache

      - name: Restore cache (rotation + LINE push log)
        uses: actions/cache@v4
        with:
          path: cache
          key: report-cache-canada-${{ github.run_number }}
          restore-keys: |
            report-cache-canada-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clear today's Gemini cache
        run: |
          TZ="America/Vancouver" python3 - <<'PYEOF'
          import datetime, pathlib, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/Vancouver")).date().isoformat()
          for f in pathlib.Path("cache").glob(f"gemini_full_{today}.json"):
              f.unlink()
              print(f"Deleted: {f}")
          PYEOF

      - name: Generate Canada morning report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region full

      - name: Commit and push report
        run: |
          git add .nojekyll index.html canada/morning/

          if git diff --staged --quiet; then
            echo "No new report to commit"
          else
            git commit -m "🌅 Canada morning report $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: sleep 45

      - name: Send LINE notification (Jobi Daily Stock 官方帳號)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_FORCE_PUSH: ${{ github.event.inputs.force_line }}
        run: |
          python scripts/notify_line.py --audience me

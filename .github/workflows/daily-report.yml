name: Daily Financial Report

on:
  schedule:
    # Vancouver 08:00 PDT = UTC 15:00
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p canada cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Move old Canada reports into canada folder
        run: |
          shopt -s nullglob
          for file in daily-financial-brief-*.html; do
            if [ -f "$file" ]; then
              git mv "$file" "canada/$file" || mv "$file" "canada/$file"
            fi
          done

          if [ -f latest.json ]; then
            git mv latest.json canada/latest.json || mv latest.json canada/latest.json
          fi

      - name: Generate Canada report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region full

      - name: Commit and push repo
        run: |
          git add .nojekyll index.html canada cache

          if git diff --staged --quiet; then
            echo "No new Canada report"
          else
            git commit -m "Update Canada daily report"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

name: Daily Canada Morning Report (加拿大晨報)

on:
  schedule:
    # 溫哥華 08:55 PDT = UTC 15:55（備援，GitHub 可能延遲）
    # 溫哥華 08:55 PST = UTC 16:55（冬令時，cron-job.org 另行設定）
    - cron: "55 15 * * 1-5"
  repository_dispatch:
    types: [trigger-canada-morning]
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE notification"
        required: false
        type: boolean
        default: false
      force_line:
        description: "Force LINE even if already sent today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-canada-morning:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p canada/morning cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Clear today's Gemini cache (ensure fresh data)
        run: |
          TZ="America/Vancouver" python - <<'PYEOF'
          import datetime, pathlib, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/Vancouver")).date().isoformat()
          for f in pathlib.Path("cache").glob(f"gemini_full_{today}.json"):
              f.unlink()
              print(f"Deleted Gemini cache: {f}")
          PYEOF

      - name: Generate Canada morning report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region full

      - name: Commit and push report
        run: |
          git add .nojekyll index.html canada/morning cache
          if git diff --staged --quiet; then
            echo "No new report to commit"
          else
            git commit -m "🌅 Canada morning report $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: sleep 45

      - name: Send LINE notification (Jobi Daily Stock 官方帳號)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_FORCE_PUSH: ${{ github.event.inputs.force_line }}
        run: |
          python scripts/notify_line.py --audience me

      - name: Commit LINE push log
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: |
          git add cache/line_push_log.json || true
          if git diff --staged --quiet; then
            echo "No push log changes"
          else
            git commit -m "Update LINE push log (canada-morning)"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

name: Daily Financial Report

on:
  schedule:
    # Vancouver 08:00 PDT = UTC 15:00
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .nojekyll
        run: touch .nojekyll

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f scripts/generate_daily_report.py ]; then
            python scripts/generate_daily_report.py --region full
          else
            echo "scripts/generate_daily_report.py not found, skipping."
          fi

      - name: Commit and push report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase --autostash origin main || true

          git add .nojekyll daily-financial-brief-*.html latest.json index.html cache/*.json

          if git diff --staged --quiet; then
            echo "No new full report to commit"
          else
            git commit -m "Update daily financial report" || echo "No changes to commit"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages to deploy
        run: sleep 45

      - name: Send LINE notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python scripts/notify_line.py --audience me

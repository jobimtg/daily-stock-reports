name: Daily Financial Report

on:
  schedule:
    # Vancouver 08:00 PDT = UTC 15:00
    # NOTE: GitHub's built-in `schedule` trigger can be delayed by hours on
    # low-activity repos. `repository_dispatch` below lets an external cron
    # (e.g. cron-job.org) fire this workflow precisely on time.
    - cron: "0 15 * * *"
  repository_dispatch:
    types: [trigger-canada-report]
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE notification after manual run"
        required: false
        type: boolean
        default: false
      force_line:
        description: "Force LINE notification even if already sent today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p canada cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Move old Canada reports into canada folder
        run: |
          shopt -s nullglob
          for file in daily-financial-brief-*.html; do
            if [ -f "$file" ]; then
              git mv "$file" "canada/$file" || mv "$file" "canada/$file"
            fi
          done

          if [ -f latest.json ]; then
            git mv latest.json canada/latest.json || mv latest.json canada/latest.json
          fi

      - name: Generate Canada report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region full

      - name: Commit and push report
        run: |
          git add .nojekyll index.html canada cache

          if git diff --staged --quiet; then
            echo "No new Canada report"
          else
            git commit -m "Update Canada daily report"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: sleep 45

      - name: Send LINE notification
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_FORCE_PUSH: ${{ github.event.inputs.force_line }}
        run: |
          python scripts/notify_line.py --audience me

      - name: Commit LINE push log
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.send_line == 'true' }}
        run: |
          git add cache/line_push_log.json || true

          if git diff --staged --quiet; then
            echo "No LINE push log changes"
          else
            git commit -m "Update LINE push log"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

name: Daily Stock Report (Taiwan / TW family)

on:
  schedule:
    - cron: "0 09 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tw-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Taiwan-only report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region tw

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tw/daily-tw-brief-*.html tw/latest.json
          if git diff --staged --quiet; then
            echo "No new TW report to commit"
          else
            git commit -m "🤖 Daily TW report"
            git pull --rebase origin main || true
            git push
          fi

      - name: Wait for GitHub Pages to deploy
        run: sleep 45

      - name: Send LINE notification (to Taiwan family)
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_IDS_TW_FAMILY:   ${{ secrets.LINE_USER_IDS_TW_FAMILY }}
        run: |
          python scripts/notify_line.py --audience tw_family

name: Daily Stock Report (Taiwan / LINE group)

on:
  schedule:
    # Taiwan 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tw-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create .nojekyll
        run: touch .nojekyll

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Move old Taiwan reports into taiwan folder
        run: |
          mkdir -p taiwan
          if [ -d tw ]; then
            shopt -s nullglob
            for file in tw/daily-tw-brief-*.html; do
              base="$(basename "$file")"
              git mv "$file" "taiwan/$base" || mv "$file" "taiwan/$base"
            done
            if [ -f tw/latest.json ]; then
              git mv tw/latest.json taiwan/latest.json || mv tw/latest.json taiwan/latest.json
            fi
          fi

      - name: Generate Taiwan-only report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region tw

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main || true

          git add             .nojekyll             taiwan/*.html             taiwan/latest.json             cache/*.json

          if git diff --staged --quiet; then
            echo "No new Taiwan report"
          else
            git commit -m "🤖 Daily Taiwan report"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        run: sleep 45

      - name: Send LINE notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: |
          python scripts/notify_line.py --audience tw_group

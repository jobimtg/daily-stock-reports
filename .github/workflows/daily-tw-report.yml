name: Daily Stock Report (Taiwan / LINE group)

on:
  schedule:
    # Taiwan 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE notification after manual run"
        required: false
        type: boolean
        default: false
      force_line:
        description: "Force LINE notification even if already sent today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-tw-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          touch .nojekyll
          mkdir -p taiwan cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Move old Taiwan reports into taiwan folder
        run: |
          shopt -s nullglob

          for file in tw/daily-tw-brief-*.html; do
            base="$(basename "$file")"
            git mv "$file" "taiwan/$base" || mv "$file" "taiwan/$base"
          done

          for file in daily-tw-brief-*.html; do
            if [ -f "$file" ]; then
              git mv "$file" "taiwan/$file" || mv "$file" "taiwan/$file"
            fi
          done

          if [ -d tw ]; then
            rm -rf tw
          fi

      - name: Generate Taiwan-only report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_report.py --region tw

      - name: Commit and push report
        run: |
          git add .nojekyll taiwan cache
          git add -u

          if git diff --staged --quiet; then
            echo "No new Taiwan report"
          else
            git commit -m "🤖 Daily Taiwan report"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Wait for GitHub Pages
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send_line == 'true' }}
        run: sleep 45

      - name: Send LINE notification
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send_line == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_FORCE_PUSH: ${{ github.event.inputs.force_line }}
        run: |
          python scripts/notify_line.py --audience tw_group

      - name: Commit LINE push log
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send_line == 'true' }}
        run: |
          git add cache/line_push_log.json || true

          if git diff --staged --quiet; then
            echo "No LINE push log changes"
          else
            git commit -m "Update LINE push log"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

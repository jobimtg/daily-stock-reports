<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Stock Reports — Jobi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh; color: #fff; -webkit-font-smoothing: antialiased;
}
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
header { text-align: center; padding: 32px 0 28px; }
.logo { font-size: 56px; margin-bottom: 8px; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.tagline { color: #a8b2d1; font-size: 14px; }
.stats {
  display: flex; gap: 12px; margin: 24px 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px; backdrop-filter: blur(10px);
}
.stat { flex: 1; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: #64ffda; }
.stat-label { font-size: 11px; color: #a8b2d1; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat + .stat { border-left: 1px solid rgba(255,255,255,0.08); }
.section-title {
  font-size: 13px; font-weight: 600; color: #a8b2d1;
  text-transform: uppercase; letter-spacing: 1px;
  margin: 28px 0 12px; padding-left: 4px;
  display: flex; align-items: center; gap: 8px;
}
.section-title .count {
  background: rgba(100,255,218,0.15); color: #64ffda;
  padding: 2px 8px; border-radius: 10px; font-size: 11px;
}
.reports { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px;
  display: flex; align-items: center; gap: 14px;
  transition: all 0.2s; text-decoration: none; color: inherit;
}
.card:hover, .card:active {
  background: rgba(100,255,218,0.08);
  border-color: rgba(100,255,218,0.3);
  transform: translateY(-1px);
}
.card .icon {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px; color: #fff;
}
.icon-daily { background: linear-gradient(135deg, #667eea, #764ba2); }
.icon-weekly { background: linear-gradient(135deg, #f093fb, #f5576c); }
.icon-monthly { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.card .info { flex: 1; min-width: 0; }
.card .title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.card .meta { font-size: 12px; color: #a8b2d1; }
.card .arrow { color: #64ffda; font-size: 22px; flex-shrink: 0; }
.empty {
  text-align: center; padding: 40px 20px;
  color: #a8b2d1; font-size: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px dashed rgba(255,255,255,0.1);
  border-radius: 12px;
}
.empty .big { font-size: 36px; margin-bottom: 8px; }
.loading { text-align: center; padding: 40px 20px; color: #a8b2d1; }
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #64ffda; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
footer {
  text-align: center; margin-top: 40px; padding: 20px 0;
  color: #6e7891; font-size: 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
footer a { color: #64ffda; text-decoration: none; }
@media (max-width: 480px) {
  h1 { font-size: 24px; }
  .stat-num { font-size: 18px; }
  .card { padding: 12px; }
  .card .title { font-size: 14px; }
}
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="logo">📈</div>
    <h1>Daily Stock Reports</h1>
    <p class="tagline">財經晨報・每週消費・每月財務分析</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="total-count">—</div>
      <div class="stat-label">Total Reports</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="latest-date">—</div>
      <div class="stat-label">Latest</div>
    </div>
    <div class="stat">
      <div class="stat-num">CAD</div>
      <div class="stat-label">Currency</div>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <footer>
    Hosted on GitHub Pages · Generated by <a href="https://claude.com">Claude</a>
  </footer>

</div>

<script>
const USERNAME = 'jobimtg';
const REPO = 'daily-stock-reports';

async function fetchRoot() {
  try {
    const r = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
    if (!r.ok) return [];
    return await r.json();
  } catch (e) { return []; }
}

function parseDate(name) {
  let m = name.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { year: m[1], month: m[2], day: m[3] };
  m = name.match(/(\d{4})-(\d{2})(?!\d)/);
  if (m) return { year: m[1], month: m[2], day: null };
  return null;
}

function fmtDate(d) {
  if (!d) return '';
  if (!d.day) {
    const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    return `${d.year} 年 ${months[parseInt(d.month)-1]}`;
  }
  const date = new Date(`${d.year}-${d.month}-${d.day}T00:00:00`);
  const wd = ['週日','週一','週二','週三','週四','週五','週六'][date.getDay()];
  return `${d.year}/${d.month}/${d.day}（${wd}）`;
}

function makeCard(file, iconClass, titleZh) {
  const d = parseDate(file.name);
  const dateStr = fmtDate(d);
  const sizeKB = (file.size / 1024).toFixed(1);
  const badge = d ? (d.day ? `${d.month}/${d.day}` : d.month) : 'NEW';
  const url = encodeURIComponent(file.name);
  return `
    <a class="card" href="${url}">
      <div class="icon ${iconClass}">${badge}</div>
      <div class="info">
        <div class="title">${titleZh}</div>
        <div class="meta">${dateStr} · ${sizeKB} KB</div>
      </div>
      <div class="arrow">›</div>
    </a>
  `;
}

async function load() {
  const files = await fetchRoot();
  const daily = [], weekly = [], monthly = [];

  for (const f of files) {
    if (f.type !== 'file') continue;
    const n = f.name.toLowerCase();
    if (n.startsWith('daily-financial-brief-') && n.endsWith('.html')) daily.push(f);
    else if (n.startsWith('weekly-expense-report-') && n.endsWith('.html')) weekly.push(f);
    else if (n.startsWith('monthly-financial-analysis-') && n.endsWith('.html')) monthly.push(f);
  }

  const byName = (a, b) => b.name.localeCompare(a.name);
  daily.sort(byName); weekly.sort(byName); monthly.sort(byName);

  const total = daily.length + weekly.length + monthly.length;
  document.getElementById('total-count').textContent = total;

  const newest = [...daily, ...weekly, ...monthly].sort(byName)[0];
  if (newest) {
    const d = parseDate(newest.name);
    if (d) document.getElementById('latest-date').textContent = d.day ? `${d.month}/${d.day}` : d.month;
  }

  let html = '';

  if (daily.length) {
    html += `<div class="section-title">📈 每日財經晨報 <span class="count">${daily.length}</span></div>`;
    html += '<div class="reports">' + daily.map(f => makeCard(f, 'icon-daily', '財經晨報')).join('') + '</div>';
  }
  if (weekly.length) {
    html += `<div class="section-title">💰 每週消費報告 <span class="count">${weekly.length}</span></div>`;
    html += '<div class="reports">' + weekly.map(f => makeCard(f, 'icon-weekly', '週消費報告')).join('') + '</div>';
  }
  if (monthly.length) {
    html += `<div class="section-title">📊 每月財務分析 <span class="count">${monthly.length}</span></div>`;
    html += '<div class="reports">' + monthly.map(f => makeCard(f, 'icon-monthly', '月財務分析')).join('') + '</div>';
  }

  if (!html) {
    html = `<div class="empty"><div class="big">📭</div>還沒有報告。上傳第一份報告到 repo 即可顯示在這裡。</div>`;
  }

  document.getElementById('content').innerHTML = html;
}

load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Stock Reports — Jobi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;color:#fff;-webkit-font-smoothing:antialiased}
.container{max-width:980px;margin:0 auto;padding:24px 16px 80px}
header{text-align:center;padding:32px 0 28px}
.logo{font-size:56px;margin-bottom:8px}
h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
.tagline{color:#a8b2d1;font-size:14px;line-height:1.5}
.stats{display:flex;gap:12px;margin:24px 0;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;backdrop-filter:blur(10px)}
.stat{flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#64ffda}
.stat-label{font-size:11px;color:#a8b2d1;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.stat+.stat{border-left:1px solid rgba(255,255,255,0.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.panel{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:14px;margin-bottom:18px}
.section-title{font-size:13px;font-weight:700;color:#dbe4ff;text-transform:uppercase;letter-spacing:0.8px;margin:4px 0 12px;padding:0 2px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title .count{background:rgba(100,255,218,0.15);color:#64ffda;padding:2px 8px;border-radius:10px;font-size:11px}
.reports{display:flex;flex-direction:column;gap:10px}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;transition:all 0.2s;text-decoration:none;color:inherit}
.card:hover,.card:active{background:rgba(100,255,218,0.08);border-color:rgba(100,255,218,0.3);transform:translateY(-1px)}
.card .icon{width:44px;height:44px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}
.icon-canada{background:linear-gradient(135deg,#d53369,#daae51)}
.icon-tw-morning{background:linear-gradient(135deg,#11998e,#38ef7d)}
.icon-tw-closing{background:linear-gradient(135deg,#667eea,#764ba2)}
.card .info{flex:1;min-width:0}
.card .title{font-size:15px;font-weight:600;margin-bottom:3px}
.card .meta{font-size:12px;color:#a8b2d1}
.card .arrow{color:#64ffda;font-size:22px;flex-shrink:0}
.empty{text-align:center;padding:34px 18px;color:#a8b2d1;font-size:14px;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);border-radius:12px}
.empty .big{font-size:34px;margin-bottom:8px}
.loading{text-align:center;padding:40px 20px;color:#a8b2d1}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,255,255,0.2);border-top-color:#64ffda;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{margin-top:16px;color:#a8b2d1;font-size:12px;line-height:1.6;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);padding:12px 14px;border-radius:12px}
footer{text-align:center;margin-top:40px;padding:20px 0;color:#6e7891;font-size:12px;border-top:1px solid rgba(255,255,255,0.06)}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
@media(max-width:480px){h1{font-size:24px}.stat-num{font-size:18px}.card{padding:12px}.card .title{font-size:14px}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">📈</div>
    <h1>Daily Stock Reports</h1>
    <p class="tagline">加拿大晨報 · 台灣開盤前晨報 · 台灣收盤報告</p>
  </header>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="total-count">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="canada-count">—</div><div class="stat-label">Canada</div></div>
    <div class="stat"><div class="stat-num" id="tw-morning-count">—</div><div class="stat-label">TW 晨報</div></div>
    <div class="stat"><div class="stat-num" id="tw-closing-count">—</div><div class="stat-label">TW 收盤</div></div>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div></div></div>
  <div class="notice">資料夾結構：<strong>canada/morning/</strong>、<strong>taiwan/morning/</strong>、<strong>taiwan/closing/</strong></div>
  <footer>Hosted on GitHub Pages · Generated by automation</footer>
</div>
<script>
const U='jobimtg', R='daily-stock-reports';
const SECTIONS=[
  {folder:'canada/morning', prefix:'daily-financial-brief-', icon:'icon-canada',     title:'🇨🇦 加拿大財經晨報',    countId:'canada-count'},
  {folder:'taiwan/morning', prefix:'tw-morning-',           icon:'icon-tw-morning',  title:'🌅 台股開盤前晨報',     countId:'tw-morning-count'},
  {folder:'taiwan/closing', prefix:'tw-closing-',           icon:'icon-tw-closing',  title:'📊 台股收盤報告',       countId:'tw-closing-count'},
];

// Also scan legacy paths for old reports
const LEGACY=[
  {folder:'canada',         prefix:'daily-financial-brief-', icon:'icon-canada',     title:'🇨🇦 加拿大財經晨報 (舊)', mergeInto:'canada/morning'},
  {folder:'taiwan',         prefix:'daily-tw-brief-',        icon:'icon-tw-morning', title:'🌅 台股晨報 (舊)',        mergeInto:'taiwan/morning'},
];

async function fetchFolder(path){
  try{
    const r=await fetch(`https://api.github.com/repos/${U}/${R}/contents/${path}`);
    if(!r.ok) return [];
    const d=await r.json();
    return Array.isArray(d)?d:[];
  }catch(e){return []}
}

function parseDate(n){const m=n.match(/(\d{4})-(\d{2})-(\d{2})/);return m?{y:m[1],m:m[2],d:m[3]}:null}
function fmtDate(d){
  if(!d) return '';
  const dt=new Date(`${d.y}-${d.m}-${d.d}T00:00:00`);
  const wd=['週日','週一','週二','週三','週四','週五','週六'][dt.getDay()];
  return `${d.y}/${d.m}/${d.d}（${wd}）`;
}

function makeCard(file,folder,sec){
  const actualFolder=file._legacyFolder||folder;
  const d=parseDate(file.name);
  const badge=d?`${d.m}/${d.d}`:'NEW';
  const kb=file.size?(file.size/1024).toFixed(1):'—';
  return `<a class="card" href="${actualFolder}/${encodeURIComponent(file.name)}">
    <div class="icon ${sec.icon}">${badge}</div>
    <div class="info"><div class="title">${sec.title}</div><div class="meta">${fmtDate(d)} · ${kb} KB</div></div>
    <div class="arrow">›</div></a>`;
}

function renderPanel(sec,files,folder){
  if(!files.length) return `<div class="panel"><div class="section-title"><span>${sec.title}</span><span class="count">0</span></div><div class="empty"><div class="big">📭</div>目前還沒有報告</div></div>`;
  return `<div class="panel"><div class="section-title"><span>${sec.title}</span><span class="count">${files.length}</span></div><div class="reports">${files.map(f=>makeCard(f,folder,sec)).join('')}</div></div>`;
}

async function load(){
  // Fetch all folders in parallel (main + legacy)
  const allFolders=[...SECTIONS,...LEGACY].map(s=>s.folder);
  const results=await Promise.all(allFolders.map(f=>fetchFolder(f)));
  
  // Build file lists per section
  const sectionFiles={};
  SECTIONS.forEach((sec,i)=>{
    const raw=results[i];
    sectionFiles[sec.folder]=raw.filter(f=>f.type==='file'&&f.name.toLowerCase().endsWith('.html')&&f.name.toLowerCase().startsWith(sec.prefix))
      .sort((a,b)=>b.name.localeCompare(a.name));
  });

  // Merge legacy files into main sections
  LEGACY.forEach((leg,i)=>{
    const raw=results[SECTIONS.length+i];
    const legFiles=raw.filter(f=>f.type==='file'&&f.name.toLowerCase().startsWith(leg.prefix)&&f.name.toLowerCase().endsWith('.html'));
    if(legFiles.length && sectionFiles[leg.mergeInto]){
      // Add legacy files with adjusted folder path
      legFiles.forEach(f=>{
        f._legacyFolder=leg.folder;
        sectionFiles[leg.mergeInto].push(f);
      });
      sectionFiles[leg.mergeInto].sort((a,b)=>b.name.localeCompare(a.name));
    }
  });

  // Update counts
  let total=0;
  SECTIONS.forEach(sec=>{
    const count=sectionFiles[sec.folder]?.length||0;
    document.getElementById(sec.countId).textContent=count;
    total+=count;
  });
  document.getElementById('total-count').textContent=total;

  // Render
  const canadaHTML=renderPanel(SECTIONS[0],sectionFiles[SECTIONS[0].folder]||[],SECTIONS[0].folder);
  const twMorningHTML=renderPanel(SECTIONS[1],sectionFiles[SECTIONS[1].folder]||[],SECTIONS[1].folder);
  const twClosingHTML=renderPanel(SECTIONS[2],sectionFiles[SECTIONS[2].folder]||[],SECTIONS[2].folder);

  document.getElementById('content').innerHTML=`
    <div class="grid">
      <div>${canadaHTML}</div>
      <div>${twMorningHTML}${twClosingHTML}</div>
    </div>`;
}
load();
</script>
</body>
</html>

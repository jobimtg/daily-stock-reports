<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Stock Reports — Jobi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;color:#fff;-webkit-font-smoothing:antialiased}.container{max-width:1120px;margin:0 auto;padding:24px 16px 80px}header{text-align:center;padding:32px 0 28px}.logo{font-size:56px;margin-bottom:8px}h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}.tagline{color:#a8b2d1;font-size:14px;line-height:1.5}.stats{display:flex;gap:12px;margin:24px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;backdrop-filter:blur(10px)}.stat{flex:1;text-align:center}.stat-num{font-size:22px;font-weight:700;color:#64ffda}.stat-label{font-size:11px;color:#a8b2d1;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}.stat+.stat{border-left:1px solid rgba(255,255,255,.08)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}.panel{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px}.section-title{font-size:13px;font-weight:700;color:#dbe4ff;text-transform:uppercase;letter-spacing:.8px;margin:4px 0 12px;padding:0 2px;display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title .count{background:rgba(100,255,218,.15);color:#64ffda;padding:2px 8px;border-radius:10px;font-size:11px}.reports{display:flex;flex-direction:column;gap:10px}.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;transition:all .2s;text-decoration:none;color:inherit}.card:hover,.card:active{background:rgba(100,255,218,.08);border-color:rgba(100,255,218,.3);transform:translateY(-1px)}.icon{width:44px;height:44px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}.icon-canada{background:linear-gradient(135deg,#d53369,#daae51)}.icon-taiwan-morning{background:linear-gradient(135deg,#11998e,#38ef7d)}.icon-taiwan-closing{background:linear-gradient(135deg,#4568dc,#b06ab3)}.info{flex:1;min-width:0}.title{font-size:15px;font-weight:600;margin-bottom:3px}.meta{font-size:12px;color:#a8b2d1}.arrow{color:#64ffda;font-size:22px;flex-shrink:0}.empty{text-align:center;padding:34px 18px;color:#a8b2d1;font-size:14px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.1);border-radius:12px}.empty .big{font-size:34px;margin-bottom:8px}.loading{text-align:center;padding:40px 20px;color:#a8b2d1}.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,255,255,.2);border-top-color:#64ffda;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.notice{margin-top:16px;color:#a8b2d1;font-size:12px;line-height:1.6;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);padding:12px 14px;border-radius:12px}footer{text-align:center;margin-top:40px;padding:20px 0;color:#6e7891;font-size:12px;border-top:1px solid rgba(255,255,255,.06)}@media(max-width:980px){.grid{grid-template-columns:1fr}}@media(max-width:480px){h1{font-size:24px}.stat-num{font-size:18px}.card{padding:12px}.title{font-size:14px}}
</style>
</head>
<body>
<div class="container">
<header><div class="logo">📈</div><h1>Daily Stock Reports</h1><p class="tagline">Canada morning + Taiwan morning + Taiwan closing reports.</p></header>
<div class="stats"><div class="stat"><div class="stat-num" id="total-count">—</div><div class="stat-label">Total</div></div><div class="stat"><div class="stat-num" id="canada-count">—</div><div class="stat-label">Canada</div></div><div class="stat"><div class="stat-num" id="taiwan-count">—</div><div class="stat-label">Taiwan</div></div></div>
<div id="content"><div class="loading"><div class="spinner"></div></div></div>
<div class="notice">Folder structure: <strong>/canada/morning/</strong>, <strong>/taiwan/morning/</strong>, and <strong>/taiwan/closing/</strong>.</div>
<footer>Hosted on GitHub Pages · Generated by automation</footer>
</div>
<script>
const USERNAME='jobimtg';
const REPO='daily-stock-reports';
async function fetchFolder(path){try{const r=await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}?t=${Date.now()}`);if(!r.ok)return[];const data=await r.json();return Array.isArray(data)?data.map(f=>({...f,_folder:path})):[]}catch(e){return[]}}
function parseDate(name){const m=name.match(/(\d{4})-(\d{2})-(\d{2})/);return m?{year:m[1],month:m[2],day:m[3]}:null}
function fmtDate(d){if(!d)return'';const date=new Date(`${d.year}-${d.month}-${d.day}T00:00:00`);const wd=['週日','週一','週二','週三','週四','週五','週六'][date.getDay()];return `${d.year}/${d.month}/${d.day}（${wd}）`}
function htmlFiles(files,prefix){return files.filter(f=>f.type==='file'&&f.name.toLowerCase().startsWith(prefix)&&f.name.toLowerCase().endsWith('.html')).sort((a,b)=>b.name.localeCompare(a.name))}
function makeCard(file,type){const d=parseDate(file.name);const dateStr=fmtDate(d);const sizeKB=file.size?(file.size/1024).toFixed(1):'—';const badge=d?`${d.month}/${d.day}`:'NEW';let title='';let icon='';if(type==='canada'){title='加拿大完整財經晨報';icon='icon-canada'}else if(type==='tw_morning'){title='台灣開盤前晨報';icon='icon-taiwan-morning'}else{title='台灣收盤報告';icon='icon-taiwan-closing'}return `<a class="card" href="${file._folder}/${encodeURIComponent(file.name)}"><div class="icon ${icon}">${badge}</div><div class="info"><div class="title">${title}</div><div class="meta">${dateStr} · ${sizeKB} KB</div></div><div class="arrow">›</div></a>`}
function renderSection(title,emoji,files,type){if(!files.length){return `<div class="panel"><div class="section-title"><span>${emoji} ${title}</span><span class="count">0</span></div><div class="empty"><div class="big">📭</div>目前還沒有報告</div></div>`}return `<div class="panel"><div class="section-title"><span>${emoji} ${title}</span><span class="count">${files.length}</span></div><div class="reports">${files.map(f=>makeCard(f,type)).join('')}</div></div>`}
async function load(){const [canadaMorning,taiwanMorning,taiwanClosing,legacyCanada,legacyTaiwan]=await Promise.all([fetchFolder('canada/morning'),fetchFolder('taiwan/morning'),fetchFolder('taiwan/closing'),fetchFolder('canada'),fetchFolder('taiwan')]);const canada=[...htmlFiles(canadaMorning,'daily-financial-brief-'),...htmlFiles(legacyCanada,'daily-financial-brief-')];const twMorning=[...htmlFiles(taiwanMorning,'tw-morning-'),...htmlFiles(taiwanMorning,'daily-tw-brief-'),...htmlFiles(legacyTaiwan,'daily-tw-brief-')];const twClosing=htmlFiles(taiwanClosing,'tw-closing-');document.getElementById('total-count').textContent=canada.length+twMorning.length+twClosing.length;document.getElementById('canada-count').textContent=canada.length;document.getElementById('taiwan-count').textContent=twMorning.length+twClosing.length;document.getElementById('content').innerHTML=`<div class="grid">${renderSection('Canada Morning','🇨🇦',canada,'canada')}${renderSection('Taiwan Morning','🇹🇼',twMorning,'tw_morning')}${renderSection('Taiwan Closing','🌙',twClosing,'tw_closing')}</div>`}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Stock Reports — Jobi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

/* Header */
header { text-align: center; padding: 32px 0 28px; }
.logo { font-size: 56px; margin-bottom: 8px; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.tagline { color: #a8b2d1; font-size: 14px; }

/* Stats bar */
.stats {
  display: flex; gap: 12px; margin: 24px 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px;
  backdrop-filter: blur(10px);
}
.stat { flex: 1; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: #64ffda; }
.stat-label { font-size: 11px; color: #a8b2d1; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat + .stat { border-left: 1px solid rgba(255,255,255,0.08); }

/* Section heading */
.section-title {
  font-size: 15px; font-weight: 600; color: #a8b2d1;
  text-transform: uppercase; letter-spacing: 1px;
  margin: 28px 0 14px; padding-left: 4px;
}

/* Report cards */
.reports { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 18px 18px;
  display: flex; align-items: center; gap: 14px;
  transition: all 0.2s;
  text-decoration: none; color: inherit;
}
.card:hover, .card:active {
  background: rgba(100,255,218,0.08);
  border-color: rgba(100,255,218,0.3);
  transform: translateY(-1px);
}
.card .icon {
  width: 44px; height: 44px; flex-shrink: 0;
  background: linear-gradient(135deg, #ee5a52, #c0392b);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px; color: #fff;
}
.card .info { flex: 1; min-width: 0; }
.card .title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.card .meta { font-size: 12px; color: #a8b2d1; }
.card .arrow { color: #64ffda; font-size: 22px; flex-shrink: 0; }

.empty {
  text-align: center; padding: 60px 20px;
  color: #a8b2d1; font-size: 14px;
}
.empty .big { font-size: 40px; margin-bottom: 12px; }

.loading {
  text-align: center; padding: 40px 20px; color: #a8b2d1;
}
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #64ffda;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer {
  text-align: center; margin-top: 40px; padding: 20px 0;
  color: #6e7891; font-size: 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
footer a { color: #64ffda; text-decoration: none; }

@media (max-width: 480px) {
  h1 { font-size: 24px; }
  .stat-num { font-size: 18px; }
  .card { padding: 14px; }
  .card .title { font-size: 14px; }
}
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="logo">📈</div>
    <h1>Daily Stock Reports</h1>
    <p class="tagline">TSX • TAIEX • TAIEX ETFs — daily by Claude</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="count">—</div>
      <div class="stat-label">Reports</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="latest">—</div>
      <div class="stat-label">Latest</div>
    </div>
    <div class="stat">
      <div class="stat-num">CAD</div>
      <div class="stat-label">Currency</div>
    </div>
  </div>

  <div class="section-title">📑 All Reports</div>
  <div id="reports" class="reports">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <footer>
    Hosted on GitHub Pages · Generated by <a href="https://claude.com">Claude</a>
  </footer>

</div>

<script>
const USERNAME = 'jobimtg';
const REPO = 'daily-stock-reports';

async function loadReports() {
  try {
    const r = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/reports`);
    if (!r.ok) throw new Error('Failed to fetch reports');
    const files = await r.json();

    // Filter PDFs, sort newest first by filename
    const pdfs = files
      .filter(f => f.name.toLowerCase().endsWith('.pdf'))
      .sort((a, b) => b.name.localeCompare(a.name));

    const container = document.getElementById('reports');
    const countEl = document.getElementById('count');
    const latestEl = document.getElementById('latest');

    countEl.textContent = pdfs.length;

    if (pdfs.length === 0) {
      container.innerHTML = `<div class="empty"><div class="big">📭</div>No reports yet. Upload your first PDF to the <code>/reports</code> folder!</div>`;
      latestEl.textContent = '—';
      return;
    }

    // Parse latest date
    const latestName = pdfs[0].name;
    const dateMatch = latestName.match(/(\d{4})(\d{2})(\d{2})/);
    if (dateMatch) {
      latestEl.textContent = `${dateMatch[2]}/${dateMatch[3]}`;
    }

    container.innerHTML = pdfs.map(f => {
      const dm = f.name.match(/(\d{4})(\d{2})(\d{2})/);
      let dateStr = '', monthDay = 'PDF';
      if (dm) {
        const d = new Date(`${dm[1]}-${dm[2]}-${dm[3]}T00:00:00`);
        const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
        const month = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
        dateStr = `${weekday}, ${month} ${parseInt(dm[3])}, ${dm[1]}`;
        monthDay = `${dm[2]}/${dm[3]}`;
      } else {
        dateStr = f.name;
      }
      const sizeKB = (f.size / 1024).toFixed(1);
      const url = `reports/${encodeURIComponent(f.name)}`;
      return `
        <a class="card" href="${url}" target="_blank" rel="noopener">
          <div class="icon">${monthDay}</div>
          <div class="info">
            <div class="title">Daily Stock Brief</div>
            <div class="meta">${dateStr} · ${sizeKB} KB</div>
          </div>
          <div class="arrow">›</div>
        </a>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('reports').innerHTML = `
      <div class="empty">
        <div class="big">⚠️</div>
        Could not load reports.<br>
        <small style="color:#6e7891">${e.message}</small>
      </div>`;
  }
}

loadReports();
</script>

</body>
</html>
